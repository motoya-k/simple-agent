[project]
name = "simple-agent"
version = "0.2.0"
description = "A minimal, fully swappable AI agent — bring your own model, inputs, outputs, and memory."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []          # standard library only, on purpose

[project.scripts]
simple-agent = "simple_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
postgres = ["psycopg[binary]>=3.1"]  # SIMPLE_AGENT_DATABASE_URL; see state_postgres.py

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
simple_agent = ["engines/*.ts"]

[tool.setuptools.packages.find]
include = ["simple_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
